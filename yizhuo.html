<style>
:root{
  --bg:#0a0b10;
  --bg-2:#12141d;
  --ink:#ece9ff;
  --ink-dim:#9a97b5;
  --ink-faint:#6c6985;
  --accent:#a78bfa;
  --accent-2:#7dd3fc;
  --line:rgba(236,233,255,.14);
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-weight:300;line-height:1.7;-webkit-font-smoothing:antialiased;overflow-x:hidden}
::selection{background:var(--accent);color:#0a0b10}
a{-webkit-tap-highlight-color:transparent}
/* --- 返回主页 --- */
.back{position:fixed;left:18px;top:18px;z-index:60;display:inline-flex;align-items:center;gap:8px;
  font-size:13.5px;color:var(--ink-dim);text-decoration:none;background:rgba(10,11,16,.72);
  border:1px solid var(--line);border-radius:999px;padding:9px 18px 9px 14px;backdrop-filter:blur(8px);
  transition:transform .22s cubic-bezier(.2,.9,.3,1.4), color .22s, border-color .22s, background .22s}
.back:hover,.back:focus-visible{color:var(--ink);border-color:var(--accent);background:rgba(10,11,16,.9);transform:translateX(-3px);outline:none}
.back i{font-style:normal;font-size:16px;line-height:1}
@media (max-width:520px){ .back{left:12px;top:12px;font-size:12.5px;padding:8px 14px 8px 11px} }
/* ===== 首屏 · 封面图 ===== */
.cover{
  position:relative;
  min-height:100vh;
  display:flex;align-items:center;justify-content:center;
  background:
	radial-gradient(120% 90% at 78% -10%, rgba(167,139,250,.16), transparent 55%),
	radial-gradient(100% 70% at 10% 110%, rgba(125,211,252,.10), transparent 55%),
	var(--bg);
  padding:0 0 0 0;
}
.cover-hint{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);
  z-index:5;display:flex;gap:10px;align-items:center;
  background:rgba(10,11,16,.66);border:1px solid var(--line);backdrop-filter:blur(6px);
  padding:8px 16px;border-radius:999px;font-size:12.5px;letter-spacing:.06em;color:var(--ink-dim);
  white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis;
}
.cover-hint::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 0 rgba(167,139,250,.6);animation:pulse 2.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(167,139,250,.55)}70%{box-shadow:0 0 0 9px rgba(167,139,250,0)}100%{box-shadow:0 0 0 0 rgba(167,139,250,0)}}

.stage{
  position:relative;width:100%;max-width:calc(100vh * 0.5618);
  aspect-ratio:1440/2563;margin:0 auto;
}
.stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}

/* 热点标记 */
.spot{
  position:absolute;transform:translate(-50%,-50%);
  display:flex;flex-direction:column;align-items:center;gap:6px;
  text-decoration:none;cursor:pointer;color:var(--ink);
  padding:16px;margin:-16px; /* 扩大点击热区，≥44px */
  outline:none;z-index:4;
}
.spot-dot{position:relative;width:20px;height:20px;border-radius:50%;background:var(--sc);box-shadow:0 0 14px 2px var(--sc), inset 0 0 6px rgba(255,255,255,.4);transition:transform .2s ease}
.spot-dot::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:1.5px solid var(--sc);opacity:.7;animation:ring 2.4s ease-out infinite}
@keyframes ring{0%{transform:scale(.8);opacity:.8}100%{transform:scale(1.7);opacity:0}}
.spot-label{font-size:11px;letter-spacing:.14em;color:var(--ink-dim);background:rgba(10,11,16,.72);border:1px solid var(--line);padding:2px 8px;border-radius:999px;backdrop-filter:blur(4px);white-space:nowrap}
.spot:hover .spot-dot,.spot:focus-visible .spot-dot{transform:scale(1.35)}
.spot:focus-visible{outline:2px solid var(--accent);outline-offset:6px;border-radius:12px}
.spot:hover .spot-label,.spot:focus-visible .spot-label{color:var(--ink);border-color:var(--sc)}
/* ===== 介绍界面 · 弹窗 ===== */
.modal{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;padding:24px}
.modal.open{display:flex}
.modal-backdrop{position:absolute;inset:0;background:rgba(5,6,10,.78);backdrop-filter:blur(8px);animation:fade .25s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal-card{
  position:relative;width:100%;max-width:520px;max-height:calc(100vh - 48px);overflow:auto;
  background:linear-gradient(180deg, #161828, #0e1018);
  border:1px solid var(--line);border-radius:18px;padding:34px 30px 26px;
  box-shadow:0 30px 80px rgba(0,0,0,.6), 0 0 60px -20px var(--sc,var(--accent));
  animation:pop .28s cubic-bezier(.2,.9,.3,1.1);
}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink-dim);font-size:20px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{color:var(--ink);border-color:var(--sc);background:rgba(255,255,255,.04)}
.m-kicker{font-size:12px;letter-spacing:.3em;color:var(--sc);margin-bottom:16px}
.m-name{font-family:var(--serif);font-weight:900;font-size:clamp(28px,6vw,40px);line-height:1.1;margin-bottom:8px}
.m-role{font-size:14px;color:var(--ink-dim);margin-bottom:20px}
.m-divider{width:46px;height:2px;border-radius:2px;background:var(--sc);margin-bottom:22px}
.m-desc{font-size:15.5px;line-height:1.9;color:var(--ink)}
.m-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.m-tag{font-size:12px;color:var(--ink-dim);border:1px solid var(--line);padding:4px 12px;border-radius:999px;letter-spacing:.04em}
@media (min-width:768px){
  .cover-hint{top:24px;font-size:13.5px;padding:10px 20px}
  .spot-dot{width:22px;height:22px}
  .spot-label{font-size:12px;padding:3px 10px}
  .modal-card{padding:44px 42px 30px;border-radius:22px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
  html{scroll-behavior:auto}
}
/* ===== 开场幕布 ===== */
/* 幕布容器 */
.curtain {
	position: fixed;
	inset: 0;
	z-index: 9999;
	pointer-events: none;
}

/* 上下两块黑布 */
.curtain-top,
.curtain-bottom {
	position: absolute;
	left: 0;
	width: 100%;
	height: 50%;
	background-image: 
		linear-gradient(rgba(10,11,16,0.75), rgba(10,11,16,0.75)),
		url("shuijiao.jpg");
	background-size: cover, cover;
	background-position: center, center;
	transition: transform 2.0s cubic-bezier(0.77, 0, 0.175, 1);
}
.curtain-top { top: 0; }
.curtain-bottom { bottom: 0; }

/* 打开时：上半往上、下半往下 */
.curtain.open .curtain-top { transform: translateY(-100%); }
.curtain.open .curtain-bottom { transform: translateY(100%); }
/* 文字容器：两句话叠在一起，居中 */
.curtain-text {
	position: absolute;
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	z-index: 10000;
	text-align: center;
	width: 100%;
}

/* 每句话的通用样式 */
.curtain-text .word {
	position: absolute;          /* 两句话叠在同一位置 */
	top: 50%;
	left: 50%;
	transform: translate(-50%, -50%);
	font-family: var(--serif);   /* 用衬线字体，更有仪式感 */
	font-weight: 900;
	font-size: clamp(40px, 10vw, 72px);
	color: var(--accent);
	letter-spacing: 0.15em;
	opacity: 0;                  /* 默认隐藏 */
	transition: opacity 1.0s ease, transform 1.0s ease;
	white-space: nowrap;
}

/* 显示状态 */
.curtain-text .word.show {
	opacity: 1;
	transform: translate(-50%, -50%) scale(1);
}

/* 初始状态：稍微缩小一点，淡入时放大 */
.curtain-text .word {
	transform: translate(-50%, -50%) scale(0.85);
}
.curtain-text .word.show {
	transform: translate(-50%, -50%) scale(1);
}

/* 幕布打开时，文字整体淡出（覆盖原有的 .curtain.open .curtain-text） */
.curtain.open .curtain-text {
	opacity: 0;
	transition: opacity 0.3s ease;
}
</style>
</head>
<body>
<a class="back" href="index.html"><i>&larr;</i>回主页</a>

<!-- 开场幕布 -->
<div class="curtain" id="curtain">
	<div class="curtain-top"></div>
	<div class="curtain-bottom"></div>
	<div class="curtain-text">
		<span class="word word-1">欢迎来到</span>
		<span class="word word-2">议桌</span>
	</div>
</div>
<!-- ===== 视图：首屏封面（图片 + 热点） ===== -->
  <section class="cover" id="cover">
   <div class="cover-hint">"竟然真会有人来到这，真是欢迎……"</div>
   <div class="stage" id="stage">
	<img src="yizhuo.jpg" alt="？？？" width="1280" height="2278" fetchpriority="high" decoding="async">
	<div class="spots" id="spots"></div>
   </div>
  </section>
  <div class="scroll-cue" id="scrollCue" role="button" tabindex="0" aria-label="下滑进入个人主页">
   <span>见证-议桌之主的真我</span> <span class="chevron"></span>
  </div>
<!-- ===== 视图：介绍界面（弹窗） ===== -->
  <div class="modal" id="modal" aria-hidden="true">
   <div class="modal-backdrop" data-close="1"></div>
   <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="mName">
	<button class="modal-close" data-close="1" aria-label="关闭">
	 <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
	  <path d="M6 6l12 12M18 6L6 18" />
	 </svg>
	</button>
	<div class="m-kicker" id="mKicker">你在看什么？</div>
	<h2 class="m-name" id="mName">未命名</h2>
	<div class="m-role" id="mRole"></div>
	<div class="m-divider" id="mDivider"></div>
	<p class="m-desc" id="mDesc"></p>
	<div class="m-tags" id="mTags"></div>

   </div>
  </div>
<script>
/* 六个热点对象：位置按图片实际人物分布设定（可微调） */
var CHARACTERS = [
  {x:17, y:24, sc:"#a78bfa", label:"司空荆", name:"我是议桌的最后一位，也是他的最后一部分", role:"ai作图，没什么办法，毕竟张晓雨的绘画天赋几乎可以说是没有", desc:"混乱、绝望、毁灭铸就了我，但却没摧毁得了他，我的存在，反倒成了他的一种自卫手段。(666(望))", tags:["你在惊讶？还是嘲笑？或许又很平静……都无所谓"]},
  {x:30, y:36, sc:"#7dd3fc", label:"司空遗", name:"没错，就是我司空遗，议桌第一人哦!", role:"还可以，这图我觉得还是可以的，但是如果理司也在旁边就更好了", desc:"冰冷、寒风、纯洁的心灵，纯粹的欲望(我以前没有这个的……)，阿巴阿巴没有什么了。(最后一句话可以不加(迹))", tags:["什么都会在高温中融化，唯有寒冷可以留下一切"]},
  {x:76, y:26, sc:"#c084fc", label:"司空召耳", name:"司空召耳", role:"真正的倚风道人，现已避世不出", desc:"贪懒怒色傲妒啖，吾怅然而弃之。——《清魂淡神咒》", tags:["(翻不着了召耳先生的本子晓雨没带来(遗))(你咋不直接进山问问，咱整这多正式(望))"]},
  {x:78, y:44, sc:"#67e8f9", label:"司空望", name:"我是爱整活的司空望，你好", role:"我爱整活，我爱看热闹", desc:"我是最普通的司空望，旁观一切之人(你这句话好中二(遗))", tags:["一切都是过客，唯有'旁观'永存"]},
  {x:30, y:70, sc:"#93c5fd", label:"司空迹", name:"你好，我叫司空迹，议桌之二", role:"绝对的理性将看透一切", desc:"我是不建议做成这样的，你们真是不嫌麻烦。(略略略(遗))", tags:["召耳先生讲:'物本有归，事本有寻。'我将践行"]},
  {x:74, y:72, sc:"#86efac", label:"司空悠悠", name:"唔，你好", role:"(她不想自我介绍了(遗))", desc:"这是司空悠悠，喜欢自然，但是不太喜欢人类", tags:["孤独的自然才是本来的自然"]}
];

/* 渲染热点 */
var spotsBox = document.getElementById("spots");
CHARACTERS.forEach(function(c, i){
  var a = document.createElement("a");
  a.className = "spot";
  a.style.left = c.x + "%";
  a.style.top  = c.y + "%";
  a.style.setProperty("--sc", c.sc);
  a.setAttribute("role","button");
  a.tabIndex = 0;
  a.setAttribute("aria-label","介绍：" + c.name);
  a.setAttribute("data-i", i);
  a.innerHTML = '<span class="spot-dot"></span><span class="spot-label">' + c.label + '</span>';
  a.addEventListener("click", function(){ openCard(i); });
  a.addEventListener("keydown", function(e){ if(e.key==="Enter"||e.key===" "){e.preventDefault();openCard(i);} });
  spotsBox.appendChild(a);
});

/* 介绍弹窗 */
var modal = document.getElementById("modal");
var mKicker=document.getElementById("mKicker"), mName=document.getElementById("mName"),
	mRole=document.getElementById("mRole"), mDivider=document.getElementById("mDivider"),
	mDesc=document.getElementById("mDesc"), mTags=document.getElementById("mTags");

function openCard(i){
  var c = CHARACTERS[i];

  mKicker.textContent = "议桌 · " + c.label;   /* 新增：弹窗顶部标注当前人物 */
  mName.textContent = c.name;
  mRole.textContent = c.role;
  mDivider.style.background = c.sc;
  mDesc.textContent = c.desc;
  mTags.innerHTML = "";
  c.tags.forEach(function(t){
	var s = document.createElement("span"); s.className="m-tag"; s.textContent=t; mTags.appendChild(s);
  });
  modal.style.setProperty("--sc", c.sc);
  modal.classList.add("open");
  modal.setAttribute("aria-hidden","false");
  document.body.style.overflow = "hidden";     /* 新增：锁滚动 */
  document.querySelector(".modal-close").focus();
}
function closeCard(){
  modal.classList.remove("open");
  modal.setAttribute("aria-hidden","true");
  document.body.style.overflow = "";           /* 新增：解锁滚动 */
}
modal.querySelectorAll("[data-close]").forEach(function(el){
  el.addEventListener("click", closeCard);
});
document.addEventListener("keydown", function(e){ if(e.key==="Escape") closeCard(); });
/* 开场幕布 · 分阶段文字动画 */
window.addEventListener('DOMContentLoaded', function() {
	var curtain = document.getElementById('curtain');
	var word1 = document.querySelector('.word-1');  // "欢迎来到"
	var word2 = document.querySelector('.word-2');  // "议桌"

	// 1. 显示“欢迎来到”
	setTimeout(function() {
		word1.classList.add('show');
	}, 200);

	// 2. “欢迎来到”淡出
	setTimeout(function() {
		word1.classList.remove('show');
	}, 1200);

	// 3. 显示“议桌”
	setTimeout(function() {
		word2.classList.add('show');
	}, 1600);

	// 4. “议桌”淡出 + 幕布打开
	setTimeout(function() {
		word2.classList.remove('show');
		curtain.classList.add('open');
	}, 2600);

	// 5. 幕布彻底移除
	setTimeout(function() {
		curtain.style.display = 'none';
	}, 3600);
});
</script>
</body>
</html>
